# AGENTS.md §7. Generated HMM is gone (PR 8). Workspace clippy/fmt on
# online.rs / tslearn.rs is still noisy until those files are split.
# Required today: redundancy lint, small-crate quality, special oracle, deny.

name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint-redundancy:
    name: scripts/lint_redundancy.sh
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Redundancy ratchet (R1 / R4 / R5 / R7 / R10, faer, stack)
        run: bash scripts/lint_redundancy.sh

  quality-small:
    name: signlred + ojizou-san (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # signlred / ojizou-san have no faer graph. 1.84.1 still builds them.
        # kanimiso cannot: generativity 1.2.1 needs edition2024 (B3).
        rust: ["1.84.1", "1.98.0", "stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - name: rustup override (ignore rust-toolchain.toml pin)
        run: rustup override set ${{ matrix.rust }}
      - run: cargo fmt --all --check
      - run: cargo clippy -p signlred -p ojizou-san --all-targets --all-features -- -D warnings
      - run: cargo test -p signlred -p ojizou-san --all-features
      - run: cargo test -p signlred -p ojizou-san --doc
      - run: cargo doc -p signlred -p ojizou-san --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  special-oracle:
    name: special.rs scipy golden
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.98.0
      - name: Replay golden/special_functions.json
        run: cargo test -p kanimiso --lib special:: -- --nocapture

  cargo-deny:
    name: cargo deny check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.84.1
      - uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check
          rust-version: "1.98.0"

  workspace-policy:
    name: AGENTS.md §7 workspace suite
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # online.rs / tslearn.rs are still not clippy/fmt-clean.
    # This job becomes a required green check after those files shrink.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          components: rustfmt, clippy, llvm-tools-preview
      - run: rustup override set stable
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: cargo test --workspace --doc
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: llvm-cov ratchet (line %)
        # Measured 2026-09-01: 75.34% lines on this stack. Budget goes down only.
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info --fail-under-lines 75
