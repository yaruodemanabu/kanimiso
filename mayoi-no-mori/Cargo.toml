[package]
name = "mayoi-no-mori"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
authors.workspace = true
description = "Deterministic Pure Rust random forests and gradient-boosted trees built on oldwood CART."
repository.workspace = true
readme = "README.md"
keywords = ["machine-learning", "random-forest", "gradient-boosting", "lightgbm", "catboost"]
categories = ["algorithms", "science", "mathematics"]

[dependencies]
amatsuki = { workspace = true }
oldwood = { workspace = true }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["-D", "warnings"]

[[example]]
name = "mayoi_quickstart"
path = "examples/quickstart.rs"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
pedantic = "deny"
