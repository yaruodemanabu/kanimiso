# cargo-deny config (AGENTS.md §7). Tighten as git deps appear (wormhole PR 3).

[graph]
targets = []
all-features = true

[advisories]
version = 2
yanked = "warn"

[licenses]
version = 2
confidence-threshold = 0.8
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "Zlib",
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# D6: faer must be a single version across the workspace graph.
deny = []
skip = []

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = ["https://github.com/yaruodemanabu/wormhole"]
