[package]
name = "kanimiso"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Verification-first Pure Rust core for time-series econometrics, online estimation, state-space models, and statistical learning."
repository.workspace = true
readme = "../README.md"
keywords = ["machine-learning", "statistics", "time-series", "online-learning", "linear-algebra"]
categories = ["science", "algorithms", "mathematics"]

[dependencies]
tsutsumi = { workspace = true, features = ["linalg"] }
number-ruler = { workspace = true }
faer = { workspace = true }
ndarray = { workspace = true }
signlred = { workspace = true }
ojizou-san = { workspace = true }
oldwood = { workspace = true }
mayoi-no-mori = { workspace = true }

[dev-dependencies]
serde_json = "1.0"
